<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alkywall - Iniciar Sesión</title>
    <link rel="stylesheet" href="styles.css">
    <script src="login.js" defer></script>
</head>
<body>

<header class="main-header">
    <div class="logo">
        <h1>Alkywall</h1>
    </div>
    <nav class="nav-menu">
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="login.html">Iniciar Sesión</a></li>
            <li><a href="register.html">Registro</a></li>
        </ul>
    </nav>
</header>

<main class="main-content">
    <section class="welcome-card" style="max-width: 400px; margin: 0 auto;">
        <h2>Iniciar Sesión</h2>
        <p style="margin-bottom: 1.5rem; color: var(--text-muted);">Ingresá tus credenciales para acceder a tu cuenta.</p>

        <form id="loginForm" class="transfer-form" novalidate>
            <div class="form-group">
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" name="email" placeholder="ejemplo@correo.com">
                <span id="errorEmail" style="color: red; font-size: 0.85rem; display: none; text-align: left; margin-top: 0.2rem;"></span>
            </div>

            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" placeholder="Tu contraseña">
                <span id="errorPassword" style="color: red; font-size: 0.85rem; display: none; text-align: left; margin-top: 0.2rem;"></span>
            </div>

            <button type="submit" class="btn-primary" style="margin-top: 1rem;">Ingresar</button>
        </form>
    </section>
</main>

<footer class="main-footer">
    <p>&copy; 2026 Alkywall. Todos los derechos reservados.</p>
</footer>

</body>
</html>
