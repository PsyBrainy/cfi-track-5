services:
  postgres:
    image: postgres:16-alpine
    container_name: alky-wallet-db
    restart: always
    environment:
      POSTGRES_DB: alky_wallet
      POSTGRES_USER: user
      POSTGRES_PASSWORD: 12345
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
