<body>
  <div class="deposito-box">
  <!-- Selector de moneda -->
  <div class="selector-moneda">
    <button type="button" id="btn-moneda">
      Elegir moneda ▾
    </button>
  </div>

  <!-- QR -->
  <div class="qr-container">
    <img src="" alt="Código QR para depósito" id="qr-deposito">
  </div>

  <form id="form-deposito">
    <!-- Input 1: CVU -->
    <div class="campo campo-copiable">
      <label for="cvu">CVU</label>
      <input type="text" id="cvu" name="cvu" value="0000003100012345678901" readonly>
      <button type="button" id="btn-copiar-cvu" class="btn-copiar">Copiar</button>
    </div>

    <!-- Input 2: Alias -->
    <div class="campo campo-copiable">
      <label for="alias">Alias</label>
      <input type="text" id="alias" name="alias" value="mi.alias.wallet" readonly>
      <button type="button" id="btn-copiar-alias" class="btn-copiar">Copiar</button>
    </div>

    <!-- Botón principal -->
    <div class="botones-accion">
      <button type="submit" id="btn-depositar">Depositar</button>
    </div>
  </form>
</div>
</body>
