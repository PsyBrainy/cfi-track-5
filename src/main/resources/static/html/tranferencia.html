<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AlkyWallet - Transferencias</title>

    <!-- CDN de Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Configuración de Colores Personalizados para Tailwind -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              bgMain: '#0D0B14',
              cardDark: '#161221',
              fuchsiaNeon: '#E025CE',
              turquoiseNeon: '#00F2FE',
              textLight: '#F4F4F6',
            }
          }
        }
      }
    </script>

    <!-- Enlace a tu hoja de estilos personalizada y JavaScript -->
    <link rel="stylesheet" href="../css/custom.css">
    <script defer src="../js/tranferencia.js"></script>

</head>
<body class="bg-bgMain text-textLight min-h-screen flex flex-col md:flex-row relative font-sans m-0 p-0 overflow-x-hidden">

    <!-- LUCES DE FONDO DE NEÓN -->
    <div class="absolute -top-10 -left-10 w-96 h-96 bg-fuchsiaNeon rounded-full opacity-20 filter blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-10 -right-10 w-96 h-96 bg-turquoiseNeon rounded-full opacity-20 filter blur-3xl pointer-events-none"></div>

    <!-- SIDEBAR / MENÚ LATERAL -->
    <aside class="w-full md:w-72 bg-cardDark/80 backdrop-blur-md border-r border-gray-800 p-6 flex flex-col justify-between z-20 shrink-0">
        <div>
            <!-- Branding / Logo -->
            <div class="flex items-center space-x-3 mb-10">
                <div class="w-16 h-16 bg-cardDark border border-fuchsiaNeon rounded-2xl flex items-center justify-center glow-fuchsia-sm shadow-lg shrink-0">
                    <svg class="w-10 h-10" fill="none" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke="#00F2FE" stroke-linecap="round" stroke-linejoin="round" d="M7 20V4m0 0L3 8m4-4l4 4" />
                        <path stroke="#E025CE" stroke-linecap="round" stroke-linejoin="round" d="M17 4v16m0 0l4-4m-4 4l-4-4" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-2xl font-extrabold tracking-wider whitespace-nowrap">
                        <span class="text-transparent bg-clip-text bg-gradient-to-r from-fuchsiaNeon to-turquoiseNeon">ALKY</span>WALLET
                    </h1>
                </div>
            </div>

            <!-- Navegación -->

                <nav class="menu space-y-2">
                    <a href="tableroDeControl.html" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-400 hover:text-white hover:bg-white/5 transition">
                     <span>Dashboard</span>
                  </a>
                    <a href="tranferencia.html" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-400 hover:text-white hover:bg-white/5 transition">
                     <span>Transferencias</span>
                 </a>
                    <a href="deposito.html" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-400 hover:text-white hover:bg-white/5 transition">
                     <span>Depósitos</span>
                 </a>
                 <a href="perfil.html" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-400 hover:text-white hover:bg-white/5 transition">
                    <span>Perfil</span>
                 </a>
                </nav>
            <!-- Botón Salir en la barra lateral -->
            <div class="pt-6 border-t border-gray-800">
                <button id="btn-salir" class="w-full flex items-center space-x-2 text-gray-400 hover:text-red-400 transition text-sm font-medium">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1m0-10V5" />
                    </svg>
                    <span>Salir de ALKYWALLET</span>
                </button>
            </div>
        </div>
    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="flex-grow flex flex-col justify-between p-6 md:p-12 z-10 min-h-screen">

        <div>
            <!-- HEADER SUPERIOR DE USUARIO -->
            <div class="flex justify-end items-center mb-6">
                <div class="flex items-center space-x-3 bg-cardDark/60 backdrop-blur-md px-4 py-2 rounded-full border border-gray-800">
                    <span class="text-sm font-medium text-white">Evano</span>
                    <img src="https://i.pravatar.cc/100?img=12" alt="Foto de Perfil" class="w-8 h-8 rounded-full border border-turquoiseNeon object-cover">
                </div>
            </div>

            <!-- CONTENEDOR DE LA TARJETA TRANSFERENCIAS -->
            <div class="max-w-md mx-auto w-full">
                <div class="transferencia-box bg-cardDark rounded-2xl p-8 relative shadow-2xl border border-fuchsiaNeon/30 glow-card-fuchsia">

                    <h2 class="text-2xl font-bold text-white mb-6 pb-4 border-b border-gray-800/80">Transferir dinero</h2>

                    <form id="form-transferencia" class="space-y-4">
                        <!-- Cuenta Origen -->
                        <div class="campo">
                            <label for="cuenta-origen" class="block text-xs text-gray-400 mb-1 font-medium">Desde</label>
                            <input type="text" id="cuenta-origen" name="cuenta-origen" value="Mi Cuenta (ARS)" readonly
                                   class="w-full bg-[#0D0B14] text-gray-300 border border-gray-800 rounded-xl px-4 py-2.5 outline-none text-sm cursor-not-allowed">
                        </div>

                        <!-- Cuenta Destino -->
                        <div class="campo">
                            <label for="cuenta-destino" class="block text-xs text-gray-400 mb-1 font-medium">Hacia (CBU / CVU / Alias)</label>
                            <input type="text" id="cuenta-destino" name="cuenta-destino" placeholder="Ej: 00000031000..."
                                   class="w-full bg-[#0D0B14] text-white border border-gray-800 rounded-xl px-4 py-2.5 outline-none focus:border-turquoiseNeon focus:ring-1 focus:ring-turquoiseNeon transition text-sm">
                        </div>

                        <!-- Monto -->
                        <div class="campo">
                            <label for="monto" class="block text-xs text-gray-400 mb-1 font-medium">Monto</label>
                            <div class="flex space-x-2">
                                <input type="number" id="monto" name="monto" placeholder="$ 0,00" step="any"
                                       class="w-full bg-[#0D0B14] text-white border border-gray-800 rounded-xl px-4 py-2.5 outline-none focus:border-turquoiseNeon focus:ring-1 focus:ring-turquoiseNeon transition text-sm font-semibold">
                                <button type="button" id="btn-all" class="bg-gray-800 hover:bg-gray-700 text-turquoiseNeon px-4 py-2.5 rounded-xl text-xs font-bold transition border border-gray-700">Total</button>
                            </div>
                        </div>

                        <!-- Botones de Acción -->
                        <div class="botones-accion pt-4 flex space-x-3">
                            <button type="submit" id="btn-enviar"
                                    class="flex-1 bg-gradient-to-r from-fuchsiaNeon to-turquoiseNeon text-white font-bold py-2.5 rounded-xl shadow-lg hover:opacity-90 transition duration-300 glow-button text-sm">
                                Transferir
                            </button>
                            <button type="button" id="btn-cancelar"
                                    class="px-5 bg-gray-800/80 hover:bg-gray-700 text-gray-300 font-semibold py-2.5 rounded-xl transition text-sm border border-gray-700">
                                Cancelar
                            </button>
                        </div>
                        <!-- Mensaje de Notificación -->
                        <div id="mensaje-notificacion" class="text-xs text-center font-medium hidden pt-2"></div>
                    </form>

                </div>
            </div>
        </div>

        <!-- FOOTER -->
        <footer class="w-full text-center text-xs text-gray-500 mt-8">
            <p>&copy; 2026 ALKYWALLET. Todos los derechos reservados</p>
        </footer>

    </main>

</body>
</html>
