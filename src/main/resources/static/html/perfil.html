<body>
  <div class="perfil-box">
  <!-- Datos del cliente (nombre y apellido) -->
  <div class="perfil-header">
    <h2 id="nombre-cliente">Nombre Apellido</h2>
  </div>

  <form id="form-perfil">
    <!-- Input 1: email -->
    <div class="campo">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="ejemplo@correo.com">
    </div>

    <!-- Input 2: celular -->
    <div class="campo">
      <label for="celular">Celular</label>
      <input type="tel" id="celular" name="celular" placeholder="Ej: 2920123456">
    </div>

    <!-- Input 3: DNI -->
    <div class="campo">
      <label for="dni">DNI</label>
      <input type="text" id="dni" name="dni" placeholder="Ej: 12345678">
    </div>

    <!-- Input 4: (ajustar segun su direccion porque habiamos puesto 2 veces correo en el dise en figma) -->
    <div class="campo">
      <label for="direccion">Dirección</label>
      <input type="text" id="direccion" name="direccion" placeholder="Ej: Calle 123">
    </div>

    <!-- Btn guardar -->
    <div class="botones-accion">
      <button type="submit" id="btn-guardar">Guardar</button>
    </div>
  </form>
</div>
</body>
