spring.application.name=alky-wallet

# Servidor
server.port=${PORT:8080}

# Base de Datos (Docker / PostgreSQL)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:alky_wallet}
spring.datasource.username=${DB_USER:user}
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Seguridad y JWT
# jwt.secret=${JWT_SECRET:MiClaveSecretaSuperSeguraParaAlkyWallet2026BaseJWT} | Decomentar cuando se utilice
# jwt.expiration=${JWT_EXPIRATION:86400000} | Decomentar cuando se utilice

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
